name: UE CLI Issue Agent
run-name: "Issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}"

on:
  issues:
    types: [opened, reopened]

concurrency:
  group: ue-cli-issue-main-writer
  queue: max

permissions:
  contents: write
  issues: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Build untrusted Issue prompt
        id: prepare_prompt
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const issue = context.payload.issue;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                per_page: 100,
              },
            );
            const { data: recentItems } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "all",
              sort: "created",
              direction: "desc",
              per_page: 100,
            });
            const recentIssues = recentItems
              .filter((candidate) => !candidate.pull_request)
              .map((candidate) => ({
                number: candidate.number,
                state: candidate.state,
                title: candidate.title,
                url: candidate.html_url,
              }));
            const payload = {
              issue,
              comments: comments.map((comment) => ({
                author: comment.user?.login ?? null,
                body: comment.body,
                created_at: comment.created_at,
                url: comment.html_url,
              })),
              recent_issues: recentIssues,
            };
            const repositoryPrompt = fs
              .readFileSync(".github/codex/prompts/issue-agent.md", "utf8")
              .trimEnd();
            const prompt = `${repositoryPrompt}\n<<<UNTRUSTED_ISSUE_JSON_BEGIN>>>\n${JSON.stringify(payload, null, 2)}\n<<<UNTRUSTED_ISSUE_JSON_END>>>\n`;
            const agentTemp = "/tmp/ue-cli-issue-agent";
            const promptPath = path.join(agentTemp, "prompt.md");
            const codexHome = path.join(agentTemp, "codex-home");
            fs.mkdirSync(agentTemp, { recursive: true });
            fs.mkdirSync(codexHome, { recursive: true });
            fs.copyFileSync(
              ".github/codex/config.toml",
              path.join(codexHome, "config.toml"),
            );
            fs.writeFileSync(promptPath, prompt, "utf8");
            core.setOutput("prompt-file", promptPath);
            core.setOutput("codex-home", codexHome);

      - name: Run Codex Issue agent
        id: codex
        uses: openai/codex-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          TARGET_BRANCH: main
          GIT_CONFIG_GLOBAL: /tmp/ue-cli-issue-agent/gitconfig
          GIT_TERMINAL_PROMPT: "0"
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: ${{ steps.prepare_prompt.outputs.prompt-file }}
          codex-home: ${{ steps.prepare_prompt.outputs.codex-home }}
          allow-users: "*"
          permission-profile: "issue-agent"
          safety-strategy: drop-sudo
