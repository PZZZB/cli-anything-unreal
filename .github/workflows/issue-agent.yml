name: UE CLI Issue Agent
run-name: "Issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}"

on:
  issues:
    types: [opened, reopened]

concurrency:
  group: ue-cli-issue-main-writer
  queue: max

permissions:
  contents: write
  issues: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Build untrusted Issue prompt
        id: prepare_prompt
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const issue = context.payload.issue;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                per_page: 100,
              },
            );
            const { data: recentItems } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "all",
              sort: "created",
              direction: "desc",
              per_page: 100,
            });
            const recentIssues = recentItems
              .filter((candidate) => !candidate.pull_request)
              .map((candidate) => ({
                number: candidate.number,
                state: candidate.state,
                title: candidate.title,
                url: candidate.html_url,
              }));
            const payload = {
              issue,
              comments: comments.map((comment) => ({
                author: comment.user?.login ?? null,
                body: comment.body,
                created_at: comment.created_at,
                url: comment.html_url,
              })),
              recent_issues: recentIssues,
            };
            const repositoryPrompt = fs
              .readFileSync(".github/codex/prompts/issue-agent.md", "utf8")
              .trimEnd();
            const prompt = `${repositoryPrompt}\n<<<UNTRUSTED_ISSUE_JSON_BEGIN>>>\n${JSON.stringify(payload, null, 2)}\n<<<UNTRUSTED_ISSUE_JSON_END>>>\n`;
            fs.writeFileSync(".codex-issue-prompt.md", prompt, "utf8");

      - name: Run Codex Issue agent
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .codex-issue-prompt.md
          allow-users: "*"
          permission-profile: ":workspace"

      - name: Remove temporary prompt
        if: ${{ always() }}
        run: rm -f .codex-issue-prompt.md

      - name: Evaluate fixed outcome
        id: decision
        if: ${{ always() }}
        uses: actions/github-script@v7
        env:
          CODEX_OUTCOME: ${{ steps.codex.outcome }}
          CODEX_FINAL_MESSAGE: ${{ steps.codex.outputs.final-message }}
        with:
          script: |
            const rawFinalMessage = process.env.CODEX_FINAL_MESSAGE ?? "";
            const firstLine = rawFinalMessage.split(/\r?\n/, 1)[0];
            const isFixed =
              process.env.CODEX_OUTCOME === "success" &&
              firstLine === "Outcome: fixed";
            core.setOutput("is-fixed", isFixed ? "true" : "false");

      - name: Commit and push verified repair
        id: publish
        if: ${{ steps.decision.outputs.is-fixed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            exit 0
          fi

          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi

          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: address Issue #${ISSUE_NUMBER}"
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Publish workflow result
        if: ${{ always() }}
        uses: actions/github-script@v7
        env:
          CODEX_FINAL_MESSAGE: ${{ steps.codex.outputs.final-message }}
          PROMPT_OUTCOME: ${{ steps.prepare_prompt.outcome }}
          CODEX_OUTCOME: ${{ steps.codex.outcome }}
          IS_FIXED: ${{ steps.decision.outputs.is-fixed }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          PUSHED: ${{ steps.publish.outputs.pushed }}
        with:
          script: |
            const promptOutcome = process.env.PROMPT_OUTCOME;
            const codexOutcome = process.env.CODEX_OUTCOME;
            const isFixed = process.env.IS_FIXED;
            const publishOutcome = process.env.PUBLISH_OUTCOME;
            const pushed = process.env.PUSHED;
            let workflowStatus;
            if (promptOutcome !== "success" || codexOutcome !== "success") {
              workflowStatus =
                "Workflow status: Prompt preparation or Codex execution failed; no changes were published.";
            } else if (isFixed !== "true") {
              workflowStatus =
                "Workflow status: Codex did not return an accepted fixed outcome; no changes were published.";
            } else if (publishOutcome !== "success") {
              workflowStatus =
                "Workflow status: Publishing the reported fix failed; the Issue remains open.";
            } else if (pushed === "true") {
              workflowStatus =
                "Workflow status: The fix was committed and pushed to main.";
            } else {
              workflowStatus =
                "Workflow status: Codex reported a fix, but no repository diff remained; nothing was published.";
            }
            const rawFinalMessage = process.env.CODEX_FINAL_MESSAGE ?? "";
            const finalMessage =
              rawFinalMessage.trim().length > 0
                ? rawFinalMessage
                : "Codex final message unavailable.";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${workflowStatus}\n\n${finalMessage}\n\nWorkflow run: ${runUrl}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body,
            });

      - name: Close pushed fix
        if: ${{ always() && steps.publish.outputs.pushed == 'true' }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              state: "closed",
            });
